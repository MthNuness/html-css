<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>
<body>
    <form autocomplete="on">
        <p requeret>
            <label for="inome">Nome de Usúario</label>
            <input type="text" name="nome" id="inome" required>
        </p>
        <p>
            <label for="isenha">Senha</label>
            <input type="password" name="senha" id="isenha" required>
        </p>
        <p>
            <label for="inum">Número de Contato</label>
            <input type="number" name="num" id="inum" max="11" required>
        </p>
        <p>
            <select name="profissao" id="iprofissao" required>
                <option value="PF">Professor</option>
                <option value="PL">Policial</option>
                <option value="EG">Engênheiro</option>
                <option value="MD">Médico</option>
                <option value="PG">Programador</option>
            </select>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
